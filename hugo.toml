baseURL = "https://kishinshuichiro.github.io/"
languageCode = "zh-cn"
title = "Meditationes Sansepulcristarum"
theme = "PaperMod"
timeZone = "Asia/Tokyo"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  defaultTheme = "dark"
  ShowReadingTime = false
  ShowFirstPost = false
  mainSections = ["posts"]
  author = "​"

[params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  location = 0
  distance = 1000
  threshold = 0.4
  minMatchCharLength = 1
  keys = ["title", "permalink", "summary", "content"]

[params.cover]
  hiddenInList = false
  hiddenInSingle = false

[menu]
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 1

  [[menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 2

  [[menu.main]]
    name = "Search"
    url = "/search/"
    weight = 3

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 4

[markup.goldmark.renderer]
  hardWraps = true
  unsafe = true

[markup.tableOfContents]
  startLevel = 1
  endLevel = 3
  ordered = false
